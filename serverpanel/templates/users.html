{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Skapa användare</h2>
  <form class="inline-form" hx-post="/users" hx-target="#toast"
        hx-on::after-request="if (event.detail.successful) this.reset()">
    <label>Användarnamn <input name="username" pattern="[a-z_][a-z0-9_\-]{0,31}" required
           title="Små bokstäver, siffror, _ och -"></label>
    <label>Lösenord <input name="password" type="password" autocomplete="new-password" required></label>
    <label class="check"><input type="checkbox" name="sudo" value="true"> Administratör (sudo)</label>
    <button class="btn primary">Skapa</button>
  </form>
</section>
<section class="card">
  <h2>Användare</h2>
  <div hx-get="/users/table" hx-trigger="refresh from:body">
    {% include "_users_table.html" %}
  </div>
</section>
{% endblock %}
